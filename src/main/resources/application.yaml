spring:
  application:
    name: FakeCommerce
  datasource:
    url: jdbc:postgresql://localhost:5432/fakecommerce
    username: postgres
    password: "1234"
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
